  /reportdata/{organization_id}/{report_id}/export:
    get:
      operationId: report_export
      summary: Export a report (raw CSV, not JSON)
      description: >
        Returns the whole report as a CSV file, NOT as a ResultPage — the
        cheapest way to get a large report without paginating.

        The response body is raw text. PSAction1 special-cases exactly two
        operations as non-JSON — `$Rawlist = @('ReportExport', 'Logs')` — and
        passes them through untouched. Any client that JSON-decodes this
        response will fail; read it as text and write it straight to a file.

        report_id is not discoverable through the API — see reports_list.
      tags: [reports]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: report_id
          in: path
          required: true
          schema: { type: string }
          description: 'Harvested from the console URL, e.g. "installed_software_1635264799139"'
      responses:
        "200":
          description: Raw CSV text (NOT a ResultPage, NOT JSON)

  /reportdata/{organization_id}/{report_id}/requery:
