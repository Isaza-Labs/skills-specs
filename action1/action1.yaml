      responses:
        "200":
          description: "ResultPage of Policy objects."
    post:
      operationId: policies_create
      summary: Create a policy instance (deploy software, updates or a script)
      description: >
        HIGH IMPACT WRITE. Creating a policy instance executes work on real
        endpoints. Always confirm the target set and the reboot options with
        the user, and never default `endpoints` to [{id: "ALL"}] silently.
        Use template_id "deploy_package" for software, "deploy_update" for
        patches, "run_script" for scripts. Full body templates are in the skill.
      tags: [policies]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, endpoints, actions]
              properties:
                name:
                  type: string
                retry_minutes:
                  type: string
                  default: "1440"
                endpoints:
                  type: array
                  description: 'Targets: [{id: "<endpoint_or_group_id>", type: "Endpoint" | "EndpointGroup"}]. id "ALL" with type "EndpointGroup" means every endpoint in the organization.'
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      type: { type: string }
                actions:
                  type: array
                  description: "Array of {name, template_id, params}. See skill for deploy_package / deploy_update / run_script parameter shapes."
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      template_id: { type: string }
                      params: { type: object }
      responses:
        "200":
          description: Policy instance created

