components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <access_token> obtained from oauth2_token."
  schemas:
    ResultPage:
      type: object
      description: >
        Envelope returned by every collection GET. WARNING: total_items and
        limit come back as STRINGS, and next_page / prev_page are empty
        strings ("") when there is no such page — never truthy-test them
        without checking for the empty string.

        The only trustworthy measure of what a page actually contains is
        len(items). `limit` is what the server says it applied and `self` is
        a URL string — neither is proof that a filter or page size was
        honoured, and in an agent runtime `self` may be reconstructed from
        the REQUEST by the layer in between rather than returned by Action1.
        When a page size or a filter appears to be ignored, compare
        len(items) across two calls that differ only in that parameter
        before concluding anything about the backend.
      properties:
        id: { type: string }
        type: { type: string, example: "ResultPage" }
        name: { type: string }
        self:
          type: string
          description: >
            Full URL of this request, e.g. ".../organizations?from=0&limit=50".
            Diagnostic value only — never treat it as evidence that the server
            applied the parameters it shows.
        items:
          type: array
          items: { type: object }
        from:
          type: integer
          description: >
            Offset the server actually served this page from. PSAction1 reads
            this back and computes the next offset as from + len(items). It is
            not present on every endpoint — fall back to the offset you sent
            when it is missing or negative.
        total_items:
          type: string
          description: Total number of matching records, as a STRING. Cast with int().
        limit:
          type: string
          description: Page size the server reports having applied, as a STRING. Diagnostic only — step the offset by len(items), not by this value and not by the value you sent.
        next_page:
          type: string
          description: Absolute URL of the next page, or "" when this is the last page.
        prev_page:
          type: string
          description: Absolute URL of the previous page, or "" when this is the first page.
