openapi: "3.0.3"
info:
  title: Action1 REST API
  version: "3.0"
  description: >
    Action1 cloud patch management / RMM native REST API v3.0.

    AUTH: OAuth2 client credentials. POST /oauth2/token with
    Content-Type: application/x-www-form-urlencoded and body
    client_id=...&client_secret=... -> {access_token, refresh_token,
    expires_in: 3600, token_type: "bearer"}. Send
    Authorization: Bearer <access_token> on every other call.

    PAGINATION (READ THIS FIRST): every GET that returns a collection
    answers with a ResultPage envelope:
    {id, type: "ResultPage", name, self, items: [...], total_items,
    limit, next_page, prev_page}. The server default page size is 50.
    If you do not send `from` and `limit` you get ONLY the first 50
    items and the rest are silently dropped. `total_items` and `limit`
    are returned as STRINGS ("324", "50"), so cast them with int()
    before comparing. Every list operation below declares `from` and
    `limit` as REQUIRED so they are always transmitted. Never present a
    result set to the user until the pagination loop has drained it.

    PAGE SIZE CEILING: 200. Action1's own PSAction1 module sets
    $Action1_PagedGetRequestDefaultLimit = 200 and validates every
    caller-supplied page size against it (Test-Action1PageSize throws
    above the maximum). Requesting limit=1000 is outside what the
    vendor's own client will emit and produces multi-megabyte bodies
    that break downstream consumers long before Action1 complains.

    ADVANCING THE OFFSET: do not step by the limit you sent. PSAction1
    re-reads the paging metadata from every response because, in its own
    words, "some endpoints may normalize the requested limit, update
    total_items between requests, or return unexpected paging values.
    This also prevents infinite loops when the returned offset does not
    advance." Step by int(response.from) + len(response.items), and
    abort the loop if the next offset is not strictly greater than the
    previous one.

    KNOWN QUIRK: the organizations endpoint returns an EMPTY first page
    for limit=1 sent without `from` (documented in PSAction1, which
    works around it by asking for limit=2 on the first page). Always
    send `from` explicitly, and treat a page size of 1 as a smoke test
    rather than a normal read pattern.

    RESPONSE SIZE: the failure mode in agent runtimes is not a bad HTTP
    status, it is a 200 whose body is too large to survive whatever sits
    between the API and the consumer. Constrain the payload at the
    source: keep limit at 100-200, and project fields instead of asking
    for `*`. See the `fields` parameter notes.

    RATE LIMIT: keep under 30 requests/minute per Action1 Enterprise or
    the API answers 429.

servers:
  - url: https://app.eu.action1.com/api/3.0
    description: Europe (default for this deployment)
  - url: https://app.action1.com/api/3.0
    description: North America
  - url: https://app.na-2.action1.com/api/3.0
    description: North America 2
  - url: https://app.au.action1.com/api/3.0
    description: Australia

security:
  - bearerAuth: []

paths:
  # ============================================================
  # Authentication
  # ============================================================
  /oauth2/token:
    post:
      operationId: oauth2_token
      summary: Get an access token (OAuth2 client credentials)
      description: >
        Exchange API credentials for a JWT bearer token. Body MUST be sent as
        application/x-www-form-urlencoded, NOT as JSON. Token lives 3600 s.
        Create the credentials in the Action1 console under
        Configuration > Users & API Credentials.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: "{access_token, refresh_token, expires_in, token_type}"

  # ============================================================
  # Identity / tenancy
  # ============================================================
  /me:
    get:
      operationId: me_get
      summary: Get the identity behind the current token
      description: >
        Returns the caller identity and the default organization. Cheap call —
        use it to verify credentials before running anything else.
      tags: [core]
      responses:
        "200":
          description: Current user object

  /enterprise:
    get:
      operationId: enterprise_get
      summary: Get enterprise-level settings
      tags: [core]
      responses:
        "200":
          description: Enterprise object
    patch:
      operationId: enterprise_update
      summary: Update enterprise-level settings
      tags: [core]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Enterprise updated

  /users:
    get:
      operationId: users_list
      summary: List console users
      tags: [core]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage: {items, total_items, limit, next_page, prev_page, self}. total_items and limit are STRINGS."

  /organizations:
    get:
      operationId: organizations_list
      summary: List organizations
      description: >
        Every other endpoint in this API is scoped by organization_id, so this
        is normally the first call you make. Cache the mapping name -> id.
      tags: [organizations]
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: Filter by organization name
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of Organization objects. total_items and limit are STRINGS."
    post:
      operationId: organizations_create
      summary: Create an organization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Organization created

  /organizations/{organization_id}:
    get:
      operationId: organizations_get
      summary: Get one organization
      tags: [organizations]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization object
    patch:
      operationId: organizations_update
      summary: Update an organization
      tags: [organizations]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Organization updated
    delete:
      operationId: organizations_delete
      summary: Delete an organization
      description: DESTRUCTIVE. Always ask the user for explicit confirmation first.
      tags: [organizations]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization deleted

  # ============================================================
  # Managed endpoints (devices)
  # ============================================================
  /endpoints/managed/{organization_id}:
    get:
      operationId: endpoints_managed_list
      summary: List managed endpoints (devices)
      description: >
        Main device inventory call. Filtering is field-based: any field that
        appears inside an item can normally be used as a query parameter
        (name, status, OS, platform, agent_version, user, address, ...).
        Use fields=* to get extended data (missing_critical_updates,
        missing_other_updates). Large tenants have thousands of endpoints —
        this endpoint MUST be drained with the from/limit loop.
      tags: [endpoints]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
          description: Organization ID, or "all" / the default org id from /me
        - name: fields
          in: query
          schema: { type: string }
          description: >
            "*" for all fields including extended data (missing_critical_updates,
            missing_other_updates); "#" or omitted for default fields; or a
            comma-separated list of field names. URL-encode "*" as %2A.

            PREFER AN EXPLICIT LIST. `fields=*` on this operation returns
            hardware, network, group_membership, custom attributes,
            missing_updates and vulnerabilities per row — hundreds of KB for a
            few dozen endpoints, and the single biggest cause of oversized
            responses in this API. Ask for the columns the answer needs, e.g.
            fields=name,status,OS,agent_version,last_seen. Use `*` only for a
            single-object read (endpoints_managed_get) or when the user
            explicitly asked for the full record.
        - name: name
          in: query
          schema: { type: string }
          description: >
            Filter by endpoint name. Action1 documents filtering as exact
            field=value matching, and states that multiple query parameters are
            ANDed ("returns records that match both filtering criterias").

            VERIFY, DO NOT ASSUME. If a name filter appears to return every
            endpoint, do not conclude the backend ignores it until you have
            compared len(items) with and without the parameter on two otherwise
            identical calls. A filter that silently does nothing usually means
            the query string is not reaching Action1 — check the layer in
            between before blaming the API. When exactness matters, resolve the
            id from a list and read the object with endpoints_managed_get.
        - name: status
          in: query
          schema: { type: string }
          description: "Filter by connection status, e.g. Connected / Disconnected"
        - name: OS
          in: query
          schema: { type: string }
          description: Filter by operating system name
        - name: platform
          in: query
          schema: { type: string }
          description: Filter by platform
        - name: agent_version
          in: query
          schema: { type: string }
          description: Filter by installed agent version
        - name: user
          in: query
          schema: { type: string }
          description: Filter by logged-on user
        - name: address
          in: query
          schema: { type: string }
          description: Filter by internal IP address
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of Endpoint objects. total_items and limit are STRINGS."

  /endpoints/managed/{organization_id}/{endpoint_id}:
    get:
      operationId: endpoints_managed_get
      summary: Get one managed endpoint
      tags: [endpoints]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string }
          description: '"*" (%2A) to include extended data'
      responses:
        "200":
          description: Endpoint object
    patch:
      operationId: endpoints_managed_update
      summary: Update a managed endpoint
      description: Typically used to set the free-text comment or custom attributes.
      tags: [endpoints]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Endpoint updated
    delete:
      operationId: endpoints_managed_delete
      summary: Unmanage / remove an endpoint
      description: DESTRUCTIVE. Ask for explicit confirmation and echo the endpoint name before calling.
      tags: [endpoints]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Endpoint removed

  /endpoints/status/{organization_id}:
    get:
      operationId: endpoints_status_list
      summary: List endpoint connection status
      tags: [endpoints]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of endpoint status objects."

  /endpoints/discovery/{organization_id}:
    get:
      operationId: endpoints_discovery_list
      summary: List discovered (unmanaged) endpoints / agent deployment status
      tags: [endpoints]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of discovered endpoints."

  # ============================================================
  # Endpoint groups
  # ============================================================
  /endpoints/groups/{organization_id}:
    get:
      operationId: endpoint_groups_list
      summary: List endpoint groups
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
          description: Filter by group name
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of EndpointGroup objects."
    post:
      operationId: endpoint_groups_create
      summary: Create an endpoint group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                type:
                  type: string
                  description: "Group type, e.g. static or dynamic"
                include_filter:
                  type: string
                  description: Membership filter expression for dynamic groups
      responses:
        "200":
          description: Group created

  /endpoints/groups/{organization_id}/{group_id}:
    get:
      operationId: endpoint_groups_get
      summary: Get one endpoint group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EndpointGroup object
    patch:
      operationId: endpoint_groups_update
      summary: Update an endpoint group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                include_filter: { type: string }
      responses:
        "200":
          description: Group updated

  /endpoints/groups/{organization_id}/{group_id}/contents:
    get:
      operationId: endpoint_group_members_list
      summary: List members of an endpoint group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: group_id
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          schema: { type: string }
          description: '"*" (%2A) to include extended data'
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of group member objects."
    post:
      operationId: endpoint_group_members_add
      summary: Add endpoints to a group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: 'Array of {id, type: "Endpoint"} objects'
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      type: { type: string, default: "Endpoint" }
      responses:
        "200":
          description: Members added
    patch:
      operationId: endpoint_group_members_set
      summary: Replace the member list of a group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      type: { type: string, default: "Endpoint" }
      responses:
        "200":
          description: Members replaced
    delete:
      operationId: endpoint_group_members_remove
      summary: Remove endpoints from a group
      tags: [groups]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: group_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      type: { type: string, default: "Endpoint" }
      responses:
        "200":
          description: Members removed

  # ============================================================
  # Installed software (apps)
  # ============================================================
  /apps/{organization_id}/data:
    get:
      operationId: installed_software_list
      summary: List installed software across the organization
      description: >
        Software inventory aggregated per organization. This is one of the
        biggest collections in the API — draining pagination is mandatory.
      tags: [software]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
          description: Filter by application name
        - name: vendor
          in: query
          schema: { type: string }
          description: Filter by publisher / vendor
        - name: version
          in: query
          schema: { type: string }
          description: Filter by version
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of installed software records."

  /apps/{organization_id}/data/{endpoint_id}:
    get:
      operationId: endpoint_software_list
      summary: List software installed on one endpoint
      tags: [software]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
        - name: limit
          in: query
          required: true
          schema: { type: integer, default: 200, minimum: 1, maximum: 200 }
          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
      responses:
        "200":
          description: "ResultPage of installed software records for the endpoint."

  /apps/{organization_id}/requery/{endpoint_id}:
    get:
      operationId: installed_software_requery
      summary: Trigger a fresh software inventory scan on an endpoint
      description: >
        Asks the agent to re-scan installed software. Results are not returned
        synchronously — poll endpoint_software_list afterwards. If the server
        answers 405 for GET, retry the same path with POST.
      tags: [software]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string }
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Requery accepted

  # ============================================================
  # Software repository / packages / scripts
  # ============================================================
  /packages/all:
    get:
      operationId: packages_list
      summary: List packages available in the Action1 software repository
      tags: [software]
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: Filter by package name
        - name: fields
          in: query
          schema: { type: string }
