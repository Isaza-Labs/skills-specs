  # ============================================================
  # Reports and data sources
  # ============================================================
  /reports/all:
    get:
      operationId: reports_list
      summary: List report categories (NOT a source of usable report ids)
      description: >
        DO NOT use this to discover a report_id. In practice this returns the
        report CATEGORY tree (e.g. the root "Built-in Reports") rather than
        concrete, exportable report definitions, and Action1 publishes no
        endpoint that enumerates report ids.

        Action1's own official example script
        (Action1Corp/APIScripts/ExportReportFromAllOrganizations.ps1) does not
        call this operation at all — it prompts the operator with
        Read-Host "Enter the Report ID" and documents that the id is read out
        of the console URL:
        https://app.action1.com/console/reports/installed_software_1635264799139/summary
        -> report_id = "installed_software_1635264799139"

        So a report_id is a deployment-specific constant harvested once from
        the console, not something to be discovered at runtime. Keep the ids
        you need in a lookup table in the skill. If an id is missing, ask the
        user to copy it from the console URL — do not go hunting through
        reports_list or data_sources_list, which is a dead end that returns
        very large, unactionable payloads.
      tags: [reports]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
