          description: "PAGE SIZE. Server default is 50 if omitted, which silently truncates - always send it. 200 is the ceiling used by Action1's own PSAction1 module (Test-Action1PageSize throws above it); do not ask for more. The server may still clamp or normalize the value, so page through by re-reading the response, never by the number you sent."
