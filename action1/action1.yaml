        - name: from
          in: query
          required: true
          schema: { type: integer, default: 0 }
          description: "PAGINATION OFFSET. Start at 0. Advance with next_from = int(response.from or current_from) + len(response.items) - never by the limit you sent. Stop when items is empty, when you have int(total_items) rows, or when next_from stops advancing."
