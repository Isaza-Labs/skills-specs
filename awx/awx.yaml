openapi: "3.0.3"
info:
  title: AWX / Ansible Tower API
  description: >
    AWX REST API. Paths are relative to the configured base URL
    (e.g., https://awx.example.com/api/v2). All endpoints use trailing slashes.
  version: "2.0"

paths:
  # ── Health & Config ──────────────────────────────────────
  /ping/:
    get:
      operationId: ping
      summary: Check AWX server health
      tags: [system]
      responses:
        "200":
          description: Server health

  /config/:
    get:
      operationId: config
      summary: Get server configuration
      tags: [system]
      responses:
        "200":
          description: Server config

  /me/:
    get:
      operationId: me
      summary: Get current user info
      tags: [system]
      responses:
        "200":
          description: Current user

  /dashboard/:
    get:
      operationId: dashboard
      summary: Get dashboard summary
      tags: [system]
      responses:
        "200":
          description: Dashboard data

  # ── Organizations ────────────────────────────────────────
  /organizations/:
    get:
      operationId: organizations_list
      summary: List organizations
      tags: [organizations]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Organization list

    post:
      operationId: organizations_create
      summary: Create an organization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created

  # ── Projects ─────────────────────────────────────────────
  /projects/:
    get:
      operationId: projects_list
      summary: List projects
      tags: [projects]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: organization
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: order_by
          in: query
          schema: { type: string }
        - name: created__gte
          in: query
          schema: { type: string }
        - name: created__lte
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Project list

    post:
      operationId: projects_create
      summary: Create a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                organization: { type: integer }
                scm_type: { type: string }
                scm_url: { type: string }
                scm_branch: { type: string }
                scm_credential: { type: integer }
                description: { type: string }
      responses:
        "201":
          description: Created

  /projects/{id}/:
    get:
      operationId: projects_read
      summary: Get project details
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Project details

    patch:
      operationId: projects_update
      summary: Update a project
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                scm_url: { type: string }
                scm_branch: { type: string }
                scm_credential: { type: integer }
                description: { type: string }
      responses:
        "200":
          description: Updated

    delete:
      operationId: projects_delete
      summary: Delete a project
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /projects/{id}/update/:
    post:
      operationId: projects_sync
      summary: Trigger project SCM sync
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Sync started

  # ── Inventories ──────────────────────────────────────────
  /inventories/:
    get:
      operationId: inventories_list
      summary: List inventories
      tags: [inventories]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: organization
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: order_by
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Inventory list

    post:
      operationId: inventories_create
      summary: Create an inventory
      tags: [inventories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                organization: { type: integer }
                description: { type: string }
      responses:
        "201":
          description: Created

  /inventories/{id}/:
    get:
      operationId: inventories_read
      summary: Get inventory details
      tags: [inventories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Inventory details

    patch:
      operationId: inventories_update
      summary: Update an inventory
      tags: [inventories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated

    delete:
      operationId: inventories_delete
      summary: Delete an inventory
      tags: [inventories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Hosts ────────────────────────────────────────────────
  /hosts/:
    get:
      operationId: hosts_list
      summary: List hosts
      tags: [hosts]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: inventory
          in: query
          schema: { type: integer }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Host list

    post:
      operationId: hosts_create
      summary: Create a host
      tags: [hosts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                inventory: { type: integer }
                description: { type: string }
                variables: { type: string }
                enabled: { type: boolean }
      responses:
        "201":
          description: Created

  /hosts/{id}/:
    get:
      operationId: hosts_read
      summary: Get host details
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Host details

    patch:
      operationId: hosts_update
      summary: Update a host
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                variables: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated

    delete:
      operationId: hosts_delete
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Groups ───────────────────────────────────────────────
  /groups/:
    get:
      operationId: groups_list
      tags: [hosts]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: inventory
          in: query
          schema: { type: integer }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Group list

    post:
      operationId: groups_create
      tags: [hosts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                inventory: { type: integer }
                description: { type: string }
                variables: { type: string }
      responses:
        "201":
          description: Created

  /groups/{id}/:
    get:
      operationId: groups_read
      summary: Get group details
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Group details

    patch:
      operationId: groups_update
      summary: Update a group
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                variables: { type: string }
      responses:
        "200":
          description: Updated

    delete:
      operationId: groups_delete
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /groups/{id}/hosts/:
    get:
      operationId: groups_hosts_list
      summary: List hosts in a group
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Host list

    post:
      operationId: groups_add_host
      summary: Add host to group
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
      responses:
        "204":
          description: Host added

  # ── Credentials ──────────────────────────────────────────
  /credentials/:
    get:
      operationId: credentials_list
      tags: [credentials]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: credential_type
          in: query
          schema: { type: integer }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Credential list

    post:
      operationId: credentials_create
      tags: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                credential_type: { type: integer }
                organization: { type: integer }
                description: { type: string }
                inputs: { type: object }
      responses:
        "201":
          description: Created

  /credentials/{id}/:
    get:
      operationId: credentials_read
      summary: Get credential details
      tags: [credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Credential details

    patch:
      operationId: credentials_update
      tags: [credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                inputs: { type: object }
      responses:
        "200":
          description: Updated

    delete:
      operationId: credentials_delete
      tags: [credentials]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /credential_types/:
    get:
      operationId: credential_types_list
      tags: [credentials]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Credential type list

  # ── Job Templates ────────────────────────────────────────
  /job_templates/:
    get:
      operationId: job_templates_list
      tags: [job_templates]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: project
          in: query
          schema: { type: integer }
        - name: inventory
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: order_by
          in: query
          schema: { type: string }
        - name: created__gte
          in: query
          schema: { type: string }
        - name: created__lte
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Template list

    post:
      operationId: job_templates_create
      tags: [job_templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                project: { type: integer }
                inventory: { type: integer }
                playbook: { type: string }
                execution_environment: { type: integer }
                description: { type: string }
                extra_vars: { type: string }
      responses:
        "201":
          description: Created

  /job_templates/{id}/:
    get:
      operationId: job_templates_read
      summary: Get job template details
      tags: [job_templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job template details

    patch:
      operationId: job_templates_update
      tags: [job_templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                playbook: { type: string }
                inventory: { type: integer }
                execution_environment: { type: integer }
                extra_vars: { type: string }
      responses:
        "200":
          description: Updated

    delete:
      operationId: job_templates_delete
      tags: [job_templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /job_templates/{id}/launch/:
    get:
      operationId: job_templates_launch_schema
      summary: Get launch schema (required/passed vars)
      tags: [job_templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Launch metadata (ask_variables_on_launch, passwords_needed_to_start, etc.)

    post:
      operationId: job_templates_launch
      summary: Launch a job template
      tags: [job_templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extra_vars: { type: object }
                limit: { type: string }
      responses:
        "201":
          description: Job launched

  /job_templates/{id}/credentials/:
    post:
      operationId: job_templates_associate_credential
      summary: Associate credential to template
      tags: [job_templates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                disassociate: { type: boolean }
      responses:
        "204":
          description: Done

  # ── Jobs ─────────────────────────────────────────────────
  /jobs/:
    get:
      operationId: jobs_list
      tags: [jobs]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: job_template
          in: query
          schema: { type: integer }
        - name: inventory
          in: query
          schema: { type: integer }
        - name: project
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: order_by
          in: query
          schema: { type: string }
        - name: started__gte
          in: query
          schema: { type: string }
        - name: started__lte
          in: query
          schema: { type: string }
        - name: created__gte
          in: query
          schema: { type: string }
        - name: finished__gte
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Job list

  /jobs/{id}/:
    get:
      operationId: jobs_read
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job details

  /jobs/{id}/stdout/:
    get:
      operationId: jobs_stdout
      summary: Get job output
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: format
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Job stdout

  /jobs/{id}/job_events/:
    get:
      operationId: jobs_events
      summary: Get job events
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: event
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Job events

  /jobs/{id}/cancel/:
    post:
      operationId: jobs_cancel
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Cancel initiated

  /jobs/{id}/relaunch/:
    post:
      operationId: jobs_relaunch
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Relaunched

  # ── Workflow Job Templates ───────────────────────────────
  /workflow_job_templates/:
    get:
      operationId: workflow_job_templates_list
      tags: [workflows]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: List

    post:
      operationId: workflow_job_templates_create
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                organization: { type: integer }
                description: { type: string }
      responses:
        "201":
          description: Created

  /workflow_job_templates/{id}/:
    get:
      operationId: workflow_job_templates_read
      summary: Get workflow job template details
      tags: [workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Workflow job template details

    patch:
      operationId: workflow_job_templates_update
      summary: Update a workflow job template
      tags: [workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated

    delete:
      operationId: workflow_job_templates_delete
      tags: [workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /workflow_job_templates/{id}/launch/:
    post:
      operationId: workflow_job_templates_launch
      tags: [workflows]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extra_vars: { type: object }
      responses:
        "201":
          description: Launched

  # ── Schedules ────────────────────────────────────────────
  /schedules/:
    get:
      operationId: schedules_list
      tags: [schedules]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Schedule list

    post:
      operationId: schedules_create
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                unified_job_template: { type: integer }
                rrule: { type: string }
                enabled: { type: boolean }
      responses:
        "201":
          description: Created

  /schedules/{id}/:
    get:
      operationId: schedules_read
      summary: Get schedule details
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Schedule details

    patch:
      operationId: schedules_update
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                rrule: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated

    delete:
      operationId: schedules_delete
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Inventory Sources ────────────────────────────────────
  /inventory_sources/:
    get:
      operationId: inventory_sources_list
      tags: [inventories]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: inventory
          in: query
          schema: { type: integer }
        - name: page_size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Source list

    post:
      operationId: inventory_sources_create
      tags: [inventories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                inventory: { type: integer }
                source: { type: string }
                source_project: { type: integer }
                source_path: { type: string }
                credential: { type: integer }
                execution_environment: { type: integer }
                overwrite: { type: boolean }
                update_on_launch: { type: boolean }
                update_on_project_update: { type: boolean }
      responses:
        "201":
          description: Created

  /inventory_sources/{id}/:
    get:
      operationId: inventory_sources_read
      summary: Get inventory source details
      tags: [inventories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Inventory source details

    patch:
      operationId: inventory_sources_update
      summary: Update an inventory source
      tags: [inventories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
