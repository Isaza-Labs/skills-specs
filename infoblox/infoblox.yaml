openapi: "3.0.3"
info:
  title: Infoblox WAPI
  description: >
    Infoblox WAPI (Web API) v2.12 (compatible with v2.10, v2.11 and v2.12).
    Base path: /wapi/v2.12/
    Authentication: HTTP Basic Auth.
    Objects are identified by _ref (opaque string), except sites (site_id).
    The /site endpoints and the /health check are custom extensions of the
    lab mock server and are not part of the standard Infoblox WAPI.
  version: "2.12"

security:
  - basicAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    ReturnFields:
      name: _return_fields
      in: query
      description: Comma-separated list of fields to return (replaces the defaults).
      schema: { type: string }
    ReturnFieldsPlus:
      name: _return_fields+
      in: query
      description: Fields to return in addition to the defaults. Encode "+" as "%2B".
      schema: { type: string }
    MaxResults:
      name: _max_results
      in: query
      description: Maximum number of results (default 1000).
      schema: { type: integer, default: 1000 }
    Paging:
      name: _paging
      in: query
      description: Enables paging. Requires _return_as_object=1.
      schema: { type: integer, enum: [0, 1] }
    ReturnAsObject:
      name: _return_as_object
      in: query
      description: Wraps the response in {"result":[...]}.
      schema: { type: integer, enum: [0, 1] }
    PageId:
      name: _page_id
      in: query
      description: Page ID used to continue paging.
      schema: { type: string }
    Ref:
      name: _ref
      in: path
      required: true
      description: Opaque Infoblox object reference.
      schema: { type: string }

  schemas:
    ExtAttrs:
      type: object
      additionalProperties:
        type: object
        properties:
          value: { type: string }

    NextAvailableIpRequest:
      type: object
      properties:
        num:
          type: integer
          default: 1
        exclude:
          type: array
          items: { type: string }

    NextAvailableNetworkRequest:
      type: object
      required: [cidr]
      properties:
        cidr: { type: integer }
        num: { type: integer, default: 1 }
        exclude:
          type: array
          items: { type: string }

    View:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        network_view: { type: string }
        comment: { type: string }
        is_default: { type: boolean }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    ZoneAuth:
      type: object
      properties:
        _ref: { type: string }
        fqdn: { type: string }
        view: { type: string }
        zone_format:
          type: string
          enum: [FORWARD, IPV4, IPV6]
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    ZoneDelegated:
      type: object
      properties:
        _ref: { type: string }
        fqdn: { type: string }
        view: { type: string }
        delegate_to:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              address: { type: string }
        comment: { type: string }

    ZoneForward:
      type: object
      properties:
        _ref: { type: string }
        fqdn: { type: string }
        view: { type: string }
        forward_to:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              address: { type: string }
        forwarders_only: { type: boolean }
        comment: { type: string }

    RecordA:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        ipv4addr: { type: string }
        view: { type: string }
        zone: { type: string }
        ttl: { type: integer }
        use_ttl: { type: boolean }
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    RecordAAAA:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        ipv6addr: { type: string }
        view: { type: string }
        ttl: { type: integer }
        use_ttl: { type: boolean }
        comment: { type: string }

    RecordCNAME:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        canonical: { type: string }
        view: { type: string }
        ttl: { type: integer }
        use_ttl: { type: boolean }
        comment: { type: string }

    RecordHostIPv4:
      type: object
      properties:
        ipv4addr: { type: string }
        mac: { type: string }
        configure_for_dhcp: { type: boolean }

    RecordHost:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        ipv4addrs:
          type: array
          items: { $ref: "#/components/schemas/RecordHostIPv4" }
        ipv6addrs:
          type: array
          items:
            type: object
            properties:
              ipv6addr: { type: string }
              duid: { type: string }
              configure_for_dhcp: { type: boolean }
        view: { type: string }
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    RecordNS:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        nameserver: { type: string }
        addresses:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
        view: { type: string }

    RecordPTR:
      type: object
      properties:
        _ref: { type: string }
        ptrdname: { type: string }
        ipv4addr: { type: string }
        ipv6addr: { type: string }
        view: { type: string }
        ttl: { type: integer }
        comment: { type: string }

    RecordMX:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        mail_exchanger: { type: string }
        preference: { type: integer }
        view: { type: string }
        ttl: { type: integer }

    RecordTXT:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        text: { type: string }
        view: { type: string }
        ttl: { type: integer }

    RecordSRV:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        target: { type: string }
        port: { type: integer }
        priority: { type: integer }
        weight: { type: integer }
        view: { type: string }
        ttl: { type: integer }

    NetworkView:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        is_default: { type: boolean }
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    Network:
      type: object
      properties:
        _ref: { type: string }
        network: { type: string }
        network_view: { type: string }
        comment: { type: string }
        options:
          type: array
          items:
            type: object
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    NetworkContainer:
      type: object
      properties:
        _ref: { type: string }
        network: { type: string }
        network_view: { type: string }
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    IPv4Address:
      type: object
      properties:
        _ref: { type: string }
        ip_address: { type: string }
        network: { type: string }
        network_view: { type: string }
        status:
          type: string
          enum: [USED, UNUSED, ACTIVE, MATCH, UNMATCHED]
        types:
          type: array
          items: { type: string }
        names:
          type: array
          items: { type: string }

    FixedAddress:
      type: object
      properties:
        _ref: { type: string }
        ipv4addr: { type: string }
        mac: { type: string }
        name: { type: string }
        network_view: { type: string }
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    Range:
      type: object
      properties:
        _ref: { type: string }
        start_addr: { type: string }
        end_addr: { type: string }
        network: { type: string }
        network_view: { type: string }
        comment: { type: string }

    Lease:
      type: object
      properties:
        _ref: { type: string }
        address: { type: string }
        binding_state:
          type: string
          enum: [ACTIVE, FREE, EXPIRED, RELEASED, RESET, BACKUP, ABANDONED]
        hardware: { type: string }
        client_hostname: { type: string }
        starts: { type: string }
        ends: { type: string }

    IPv6Network:
      type: object
      properties:
        _ref: { type: string }
        network: { type: string }
        network_view: { type: string }
        comment: { type: string }
        extattrs: { $ref: "#/components/schemas/ExtAttrs" }

    IPv6Address:
      type: object
      properties:
        _ref: { type: string }
        ip_address: { type: string }
        network: { type: string }
        network_view: { type: string }
        status: { type: string }
        types:
          type: array
          items: { type: string }
        names:
          type: array
          items: { type: string }

    IPv6FixedAddress:
      type: object
      properties:
        _ref: { type: string }
        ipv6addr: { type: string }
        duid: { type: string }
        name: { type: string }
        network_view: { type: string }
        comment: { type: string }

    IPv6Range:
      type: object
      properties:
        _ref: { type: string }
        start_addr: { type: string }
        end_addr: { type: string }
        network: { type: string }
        network_view: { type: string }
        comment: { type: string }

    Grid:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }
        version: { type: string }

    Site:
      type: object
      properties:
        site_id: { type: string }
        name: { type: string }
        location: { type: string }
        region: { type: string }
        network_container: { type: string }
        comment: { type: string }

    SiteSummary:
      type: object
      properties:
        site_id: { type: string }
        total_networks: { type: integer }
        used_ips: { type: integer }
        free_ips: { type: integer }
        utilization_pct: { type: number }

    SearchResult:
      type: object
      properties:
        _ref: { type: string }
        name: { type: string }

paths:
  # ── Health ───────────────────────────────────────────────
  /health:
    get:
      operationId: health
      summary: Health check (lab mock extension, not standard WAPI)
      description: >
        Custom extension of the lab mock server, not part of the standard
        Infoblox WAPI. Served at the server root (/health), outside the
        /wapi/v2.12 base path.
      tags: [system]
      security: []
      responses:
        "200": { description: OK }

  # ── Grid ─────────────────────────────────────────────────
  /grid:
    get:
      operationId: grid_read
      summary: Get Grid information
      tags: [grid]
      responses:
        "200":
          description: Grid info
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Grid" }

  # ── Global search ────────────────────────────────────────
  /search:
    get:
      operationId: search
      summary: Global search across multiple DNS object types
      description: >
        Supports search_string (exact), search_string~ (regex),
        search_string: (case-insensitive). Supported types:
        record:a, record:aaaa, record:cname, record:host, record:mx,
        record:txt, record:ptr, record:srv, record:ns, zone_auth,
        zone_delegated, zone_forward.
      tags: [search]
      parameters:
        - name: search_string
          in: query
          schema: { type: string }
        - name: search_string~
          in: query
          schema: { type: string }
        - name: "search_string:"
          in: query
          schema: { type: string }
        - name: objtype
          in: query
          description: Comma-separated list of object types (e.g. "record:a,record:cname").
          schema: { type: string }
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/ReturnFields"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }

  # ── Allrecords ───────────────────────────────────────────
  /allrecords:
    get:
      operationId: allrecords
      summary: List all DNS records (optionally filtered by zone/view)
      tags: [dns]
      parameters:
        - name: zone
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/ReturnFields"
      responses:
        "200": { description: List of records }

  # ── View (DNS) ───────────────────────────────────────────
  /view:
    get:
      operationId: view_list
      summary: List DNS views
      tags: [dns-view]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: network_view
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ReturnFields"
        - $ref: "#/components/parameters/ReturnFieldsPlus"
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/Paging"
        - $ref: "#/components/parameters/ReturnAsObject"
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/View" }

    post:
      operationId: view_create
      summary: Create DNS view
      tags: [dns-view]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/View" }
      responses:
        "201": { description: Created (returns _ref as a string) }

  /view/{_ref}:
    parameters:
      - $ref: "#/components/parameters/Ref"
    get:
      operationId: view_read
      summary: Get DNS view
      tags: [dns-view]
      responses:
        "200":
          description: View
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
    put:
      operationId: view_update
      summary: Replace DNS view (full PUT)
      tags: [dns-view]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/View" }
      responses:
        "200": { description: Updated }
    patch:
      operationId: view_patch
      summary: Partially update DNS view
      tags: [dns-view]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/View" }
      responses:
        "200": { description: Updated }
    delete:
      operationId: view_delete
      summary: Delete DNS view
      tags: [dns-view]
      responses:
        "200": { description: Deleted }

  # ── zone_auth ────────────────────────────────────────────
  /zone_auth:
    get:
      operationId: zone_auth_list
      summary: List authoritative zones
      tags: [zone_auth]
      parameters:
        - name: fqdn
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string }
        - name: zone_format
          in: query
          schema: { type: string, enum: [FORWARD, IPV4, IPV6] }
        - $ref: "#/components/parameters/ReturnFields"
        - $ref: "#/components/parameters/ReturnFieldsPlus"
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/Paging"
        - $ref: "#/components/parameters/ReturnAsObject"
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneAuth" }
    post:
      operationId: zone_auth_create
      summary: Create authoritative zone
      tags: [zone_auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneAuth" }
      responses:
        "201": { description: Created }

  /zone_auth/{_ref}:
    parameters:
      - $ref: "#/components/parameters/Ref"
    get:
      operationId: zone_auth_read
      summary: Get authoritative zone
      tags: [zone_auth]
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneAuth" }
    put:
      operationId: zone_auth_update
      summary: Replace authoritative zone
      tags: [zone_auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneAuth" }
      responses:
        "200": { description: Updated }
    patch:
      operationId: zone_auth_patch
      summary: Partially update authoritative zone
      tags: [zone_auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneAuth" }
      responses:
        "200": { description: Updated }
    delete:
      operationId: zone_auth_delete
      summary: Delete authoritative zone
      tags: [zone_auth]
      responses:
        "200": { description: Deleted }

  # ── zone_delegated ───────────────────────────────────────
  /zone_delegated:
    get:
      operationId: zone_delegated_list
      summary: List delegated zones
      tags: [zone_delegated]
      parameters:
        - name: fqdn
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ReturnFields"
        - $ref: "#/components/parameters/MaxResults"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneDelegated" }
    post:
      operationId: zone_delegated_create
      summary: Create delegated zone
      tags: [zone_delegated]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneDelegated" }
      responses:
        "201": { description: Created }

  /zone_delegated/{_ref}:
    parameters:
      - $ref: "#/components/parameters/Ref"
    get:
      operationId: zone_delegated_read
      summary: Get delegated zone
      tags: [zone_delegated]
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneDelegated" }
    put:
      operationId: zone_delegated_update
      summary: Replace delegated zone
      tags: [zone_delegated]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneDelegated" }
      responses:
        "200": { description: Updated }
    patch:
      operationId: zone_delegated_patch
      summary: Partially update delegated zone
      tags: [zone_delegated]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneDelegated" }
      responses:
        "200": { description: Updated }
    delete:
      operationId: zone_delegated_delete
      summary: Delete delegated zone
      tags: [zone_delegated]
      responses:
        "200": { description: Deleted }

  # ── zone_forward ─────────────────────────────────────────
  /zone_forward:
    get:
      operationId: zone_forward_list
      summary: List forward zones
      tags: [zone_forward]
      parameters:
        - name: fqdn
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ReturnFields"
        - $ref: "#/components/parameters/MaxResults"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneForward" }
    post:
      operationId: zone_forward_create
      summary: Create forward zone
      tags: [zone_forward]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneForward" }
      responses:
        "201": { description: Created }

  /zone_forward/{_ref}:
    parameters:
      - $ref: "#/components/parameters/Ref"
    get:
      operationId: zone_forward_read
      summary: Get forward zone
      tags: [zone_forward]
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneForward" }
    put:
      operationId: zone_forward_update
      summary: Replace forward zone
      tags: [zone_forward]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneForward" }
      responses:
        "200": { description: Updated }
    patch:
      operationId: zone_forward_patch
      summary: Partially update forward zone
      tags: [zone_forward]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneForward" }
      responses:
        "200": { description: Updated }
    delete:
      operationId: zone_forward_delete
      summary: Delete forward zone
      tags: [zone_forward]
      responses:
        "200": { description: Deleted }

  # ── record:a ─────────────────────────────────────────────
  /record:a:
    get:
      operationId: record_a_list
      summary: List A records
      tags: [record_a]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: ipv4addr
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string }
        - name: zone
          in: query
          schema: { type: string }
        - name: comment
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ReturnFields"
        - $ref: "#/components/parameters/ReturnFieldsPlus"
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/Paging"
        - $ref: "#/components/parameters/ReturnAsObject"
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecordA" }
    post:
      operationId: record_a_create
      summary: Create A record
      tags: [record_a]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordA" }
      responses:
        "201": { description: Created }

  /record:a/{_ref}:
    parameters:
      - $ref: "#/components/parameters/Ref"
    get:
      operationId: record_a_read
      summary: Get A record
      tags: [record_a]
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordA" }
    put:
      operationId: record_a_update
      summary: Replace A record
      tags: [record_a]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordA" }
      responses:
        "200": { description: Updated }
    patch:
      operationId: record_a_patch
      summary: Partially update A record
      tags: [record_a]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordA" }
      responses:
        "200": { description: Updated }
    delete:
      operationId: record_a_delete
      summary: Delete A record
      tags: [record_a]
      responses:
        "200": { description: Deleted }

  # ── record:aaaa ──────────────────────────────────────────
  /record:aaaa:
    get:
      operationId: record_aaaa_list
      summary: List AAAA records
      tags: [record_aaaa]
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - name: ipv6addr
          in: query
          schema: { type: string }
        - name: view
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ReturnFields"
        - $ref: "#/components/parameters/MaxResults"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
