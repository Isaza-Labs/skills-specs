        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                manufacturer: {description: "Manufacturer ID (optional)"}
                description: {type: string}
                tags: {type: array, items: {type: object}}
      responses:
        "201":
          description: Platform created

  /api/dcim/platforms/{id}/:
    patch:
      operationId: dcim_platforms_partial_update
      summary: Partially update a platform
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                slug: {type: string}
                manufacturer: {description: "Manufacturer ID"}
                description: {type: string}
      responses:
        "200":
          description: Platform updated

  # ===== Tenants =====
    get:
      operationId: dcim_platforms_retrieve
      summary: Get one of the platforms by ID
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
  /api/tenancy/tenants/:
    get:
      operationId: tenancy_tenants_list
      summary: List tenants
      tags: [tenancy]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: group, in: query, schema: {type: array, items: {type: string}}}
      - {name: tag, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: tenancy_tenants_create
      summary: Create a tenant
      tags: [tenancy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                comments: {type: string}
                group: {description: "Tenant group ID (optional)"}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Pre-flight required: object_type=tenancy.tenant"}
      responses:
        "201":
          description: Tenant created

  /api/tenancy/tenants/{id}/:
    patch:
      operationId: tenancy_tenants_partial_update
      summary: Partially update a tenant
      tags: [tenancy]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                comments: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Pre-flight required: object_type=tenancy.tenant"}
      responses:
        "200":
          description: Tenant updated

  # ===== Circuits =====
    get:
      operationId: tenancy_tenants_retrieve
      summary: Get one of the tenants by ID
      tags: [tenancy]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
  /api/circuits/circuits/:
    get:
      operationId: circuits_circuits_list
      summary: List circuits
      tags: [circuits]
      parameters:
      - {name: cid, in: query, schema: {type: array, items: {type: string}}}
      - {name: provider, in: query, schema: {type: array, items: {type: string}}, description: "Provider slug"}
      - {name: provider_id, in: query, schema: {type: array, items: {type: integer}}}
      - {name: type, in: query, schema: {type: array, items: {type: string}}, description: "Circuit type slug"}
      - {name: status, in: query, schema: {type: array, items: {type: string}}}
      - {name: tenant, in: query, schema: {type: array, items: {type: string}}}
      - {name: tag, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: circuits_circuits_create
      summary: Create a circuit
      tags: [circuits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, type, provider]
              properties:
                cid: {type: string, description: "Circuit ID"}
                type: {description: "Circuit type ID (integer)"}
                provider: {description: "Provider ID (integer)"}
                status: {type: string, default: "active"}
                description: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Pre-flight required: object_type=circuits.circuit"}
      responses:
        "201":
          description: Circuit created

  /api/circuits/circuits/{id}/:
    patch:
      operationId: circuits_circuits_partial_update
      summary: Partially update a circuit
      tags: [circuits]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cid: {type: string}
                status: {type: string}
                description: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Pre-flight required: object_type=circuits.circuit"}
      responses:
        "200":
          description: Circuit updated

  # ===== Circuit Types =====
    get:
      operationId: circuits_circuits_retrieve
      summary: Get one of the circuits by ID
      tags: [circuits]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
  /api/circuits/circuit-types/:
    get:
      operationId: circuits_circuit_types_list
      summary: List circuit types
      tags: [circuits]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
