  /api/ipam/ip-addresses/{id}/:
    get:
      operationId: ipam_ip_addresses_retrieve
      summary: Get one of the ip addresses by ID
      tags: [ipam]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
    patch:
      operationId: ipam_ip_addresses_partial_update
      summary: Partially update ip addresses
      description: 'Update an IP address: status, dns_name, description, tags, or its assignment (assigned_object_type + assigned_object_id).'
      tags: [ipam]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                vrf:
                  description: see NetBox API
                tenant:
                  description: see NetBox API
                status:
                  type: string
                  enum:
                  - active
                  - reserved
                  - deprecated
                  - dhcp
                  - slaac
                  description: "The operational status of this IP\n\n* `active` - Active\n* `reserved` - Reserved\n* `deprecated` - Deprecated\n* `dhcp` - DHCP\n* `slaac` - SLAAC"
                role:
                  type: string
                  enum:
                  - loopback
                  - secondary
                  - anycast
                  - vip
                  - vrrp
                  - hsrp
                  - glbp
                  - carp
                assigned_object_type:
                  type: string
                assigned_object_id:
                  type: integer
                nat_inside:
                  type: integer
                  description: The IP for which this address is the "outside" IP
                dns_name:
                  type: string
                  description: Hostname or FQDN (not case-sensitive)
                description:
                  type: string
                comments:
                  type: string
                tags:
                  type: array
                  items:
                    type: object
                custom_fields:
                  type: object
      responses:
        '200':
          description: Updated
