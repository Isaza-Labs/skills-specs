          description: "Paginated list"
    post:
      operationId: circuits_circuit_types_create
      summary: Create a circuit type
      tags: [circuits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                tags: {type: array, items: {type: object}}
      responses:
        "201":
          description: Circuit type created

  # ===== Providers =====
  /api/circuits/providers/:
    get:
      operationId: circuits_providers_list
      summary: List providers
      tags: [circuits]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: circuits_providers_create
      summary: Create a provider
      tags: [circuits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                comments: {type: string}
                accounts: {type: array, items: {type: integer}, description: "Provider account IDs (NetBox 4.x; replaces the old 'account' text field)"}
                asns: {type: array, items: {type: integer}, description: "ASN object IDs (NetBox 4.x; replaces the old 'asn' integer)"}
                tags: {type: array, items: {type: object}}
      responses:
        "201":
          description: Provider created

  /api/circuits/providers/{id}/:
    patch:
      operationId: circuits_providers_partial_update
      summary: Partially update a provider
      tags: [circuits]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                comments: {type: string}
                accounts: {type: array, items: {type: integer}}
                asns: {type: array, items: {type: integer}}
                tags: {type: array, items: {type: object}}
      responses:
        "200":
          description: Provider updated

  # ===== Custom Fields =====
    get:
      operationId: circuits_providers_retrieve
      summary: Get one of the providers by ID
      tags: [circuits]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
  /api/extras/custom-fields/:
    get:
      operationId: extras_custom_fields_list
      summary: List custom fields
      description: >
        List custom field definitions. Use object_type to filter to a single
        target model (e.g. dcim.device) — this is the canonical pre-flight
        before sending custom_fields in any device/site/circuit create or
        update payload.
      tags: [extras]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}, description: "Filter by field name"}
      - {name: object_type, in: query, schema: {type: array, items: {type: string}}, description: "Filter by target object type, e.g. 'dcim.device', 'dcim.site', 'tenancy.tenant', 'circuits.circuit'"}
      - {name: type, in: query, schema: {type: array, items: {type: string}}, description: "Filter by field type (text, longtext, integer, boolean, date, json, ...)"}
      - {name: required, in: query, schema: {type: boolean}, description: "Filter by whether the field is required"}
      - {name: q, in: query, schema: {type: string}, description: "Free-text search"}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: extras_custom_fields_create
      summary: Create a custom field
      description: >
        Declare a new custom field for one or more object types. Required
        before any object's custom_fields payload may include this field's
        name. Use type=longtext for multi-line strings (configs, command
        outputs), type=text for short values, type=json for dicts/lists.
      tags: [extras]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, object_types]
              properties:
                name: {type: string, description: "Snake_case identifier used in custom_fields payloads"}
                label: {type: string, description: "Human-readable label shown in the UI; defaults to a Title Case version of name"}
                type: {type: string, description: "text, longtext, integer, boolean, date, url, json, select, multiselect, object, multiobject"}
                object_types: {type: array, items: {type: string}, description: "Content types this field applies to, e.g. ['dcim.device', 'dcim.site']"}
                description: {type: string}
                required: {type: boolean, default: false}
                default: {type: string, description: "Default value (must match the field type)"}
      responses:
        "201":
          description: Custom field created

  /api/extras/custom-fields/{id}/:
    patch:
      operationId: extras_custom_fields_partial_update
      summary: Partially update a custom field
      tags: [extras]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string}
                description: {type: string}
                object_types: {type: array, items: {type: string}}
                required: {type: boolean}
      responses:
        "200":
          description: Custom field updated

    get:
