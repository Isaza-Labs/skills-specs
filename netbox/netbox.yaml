  /api/ipam/ip-addresses/:
    get:
      operationId: ipam_ip_addresses_list
      summary: List IP addresses
      tags: [ipam]
      parameters:
      - {name: address, in: query, schema: {type: array, items: {type: string}}, description: "Exact address, e.g. 10.0.0.1/24"}
      - {name: device, in: query, schema: {type: array, items: {type: string}}, description: "Filter by assigned device name"}
      - {name: device_id, in: query, schema: {type: array, items: {type: integer}}}
      - {name: parent, in: query, schema: {type: array, items: {type: string}}, description: "Addresses inside this prefix"}
      - {name: status, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}, description: "Max results per page (max 1000)"}
      - {name: offset, in: query, schema: {type: integer, default: 0}, description: "Records to skip"}
      responses:
        "200":
          description: "Paginated list"

    post:
      operationId: ipam_ip_addresses_create
      summary: Create ip addresses
      description: "Create an IP address in CIDR form (address: 10.0.0.1/24). To assign it to an interface set assigned_object_type 'dcim.interface' and assigned_object_id <interface id>. To make it the device's primary IP, PATCH the device with primary_ip4: <ip address id> after the IP is assigned to one of its interfaces."
      tags: [ipam]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              properties:
                address:
                  type: string
                vrf:
                  description: see NetBox API
                tenant:
                  description: see NetBox API
                status:
                  type: string
                  enum:
                  - active
                  - reserved
                  - deprecated
                  - dhcp
                  - slaac
                  description: "The operational status of this IP\n\n* `active` - Active\n* `reserved` - Reserved\n* `deprecated` - Deprecated\n* `dhcp` - DHCP\n* `slaac` - SLAAC"
                role:
                  type: string
                  enum:
                  - loopback
                  - secondary
                  - anycast
                  - vip
                  - vrrp
                  - hsrp
                  - glbp
                  - carp
                assigned_object_type:
                  type: string
                assigned_object_id:
                  type: integer
                nat_inside:
                  type: integer
                  description: The IP for which this address is the "outside" IP
                dns_name:
                  type: string
                  description: Hostname or FQDN (not case-sensitive)
                description:
                  type: string
                comments:
                  type: string
                tags:
                  type: array
                  items:
                    type: object
                custom_fields:
                  type: object
      responses:
        '201':
          description: Created
  /api/ipam/prefixes/:
    get:
      operationId: ipam_prefixes_list
      summary: List prefixes
      tags: [ipam]
      parameters:
      - {name: prefix, in: query, schema: {type: array, items: {type: string}}, description: "Exact prefix, e.g. 10.0.0.0/24"}
      - {name: within, in: query, schema: {type: string}, description: "Prefixes inside this one"}
      - {name: contains, in: query, schema: {type: string}, description: "Prefixes containing this address or prefix"}
      - {name: site, in: query, schema: {type: array, items: {type: string}}}
      - {name: status, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}, description: "Max results per page (max 1000)"}
      - {name: offset, in: query, schema: {type: integer, default: 0}, description: "Records to skip"}
      responses:
        "200":
          description: "Paginated list"

    post:
      operationId: ipam_prefixes_create
      summary: Create prefixes
      description: 'Create a prefix (prefix: 10.0.0.0/24). Optional: scope (scope_type + scope_id, for example dcim.site), vrf, vlan, status, role, tenant.'
      tags: [ipam]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - prefix
              properties:
                prefix:
                  type: string
                vrf:
                  description: see NetBox API
                scope_type:
                  type: string
                scope_id:
                  type: integer
                tenant:
                  description: see NetBox API
                vlan:
                  description: see NetBox API
                status:
                  type: string
                  enum:
                  - container
                  - active
                  - reserved
                  - deprecated
                  description: "Operational status of this prefix\n\n* `container` - Container\n* `active` - Active\n* `reserved` - Reserved\n* `deprecated` - Deprecated"
                role:
                  description: see NetBox API
                is_pool:
                  type: boolean
                  description: All IP addresses within this prefix are considered usable
                mark_utilized:
                  type: boolean
                  description: Treat as fully utilized
                description:
                  type: string
                comments:
                  type: string
                tags:
                  type: array
                  items:
                    type: object
                custom_fields:
                  type: object
      responses:
        '201':
          description: Created
  /api/ipam/vlans/:
    get:
      operationId: ipam_vlans_list
      summary: List VLANs
      tags: [ipam]
      parameters:
      - {name: vid, in: query, schema: {type: array, items: {type: integer}}, description: "VLAN ID"}
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: site, in: query, schema: {type: array, items: {type: string}}}
      - {name: status, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}, description: "Max results per page (max 1000)"}
      - {name: offset, in: query, schema: {type: integer, default: 0}, description: "Records to skip"}
      responses:
        "200":
          description: "Paginated list"

  # ===== Tags =====
    post:
      operationId: ipam_vlans_create
      summary: Create vlans
      description: 'Create a VLAN. Required: vid (1-4094) and name. Optional: site or group, status, tenant, role.'
      tags: [ipam]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - vid
              properties:
                site:
                  description: see NetBox API
                group:
                  description: see NetBox API
                vid:
                  type: integer
                  description: Numeric VLAN ID (1-4094)
                name:
                  type: string
                tenant:
                  description: see NetBox API
                status:
                  type: string
                  enum:
                  - active
                  - reserved
                  - deprecated
                  description: "Operational status of this VLAN\n\n* `active` - Active\n* `reserved` - Reserved\n* `deprecated` - Deprecated"
                role:
                  description: see NetBox API
                description:
                  type: string
                qinq_role:
                  type: string
                  enum:
                  - svlan
                  - cvlan
                  description: "Customer/service VLAN designation (for Q-in-Q/IEEE 802.1ad)\n\n* `svlan` - Service\n* `cvlan` - Customer"
                qinq_svlan:
                  type: integer
                comments:
                  type: string
                tags:
                  type: array
                  items:
                    type: object
                custom_fields:
                  type: object
      responses:
        '201':
          description: Created
  /api/extras/tags/:
    get:
      operationId: extras_tags_list
      summary: List tags
      description: List tags. Check that a tag exists (by slug) before adding it to a device or creating it.
      tags: [extras]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}, description: "Max results per page (max 1000)"}
      - {name: offset, in: query, schema: {type: integer, default: 0}, description: "Records to skip"}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: extras_tags_create
      summary: Create a tag
      description: "Create a tag. To tag a device, PATCH the device with its full tags list (existing tags plus the new one), as [{slug: '...'}]."
      tags: [extras]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                color: {type: string, description: "Hex color without #, e.g. 4caf50"}
                description: {type: string}
      responses:
        "201":
          description: Tag created
