    post:
      operationId: dcim_manufacturers_create
      summary: Create a manufacturer
      tags: [dcim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
                tags: {type: array, items: {type: object}}
      responses:
        "201":
          description: Manufacturer created

  /api/dcim/manufacturers/{id}/:
    patch:
      operationId: dcim_manufacturers_partial_update
      summary: Partially update a manufacturer
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                slug: {type: string}
                description: {type: string}
      responses:
        "200":
          description: Manufacturer updated

  # ===== Platforms =====
    get:
      operationId: dcim_manufacturers_retrieve
      summary: Get one of the manufacturers by ID
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
  /api/dcim/platforms/:
    get:
      operationId: dcim_platforms_list
      summary: List platforms
      tags: [dcim]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: manufacturer, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: dcim_platforms_create
      summary: Create a platform
      tags: [dcim]
      requestBody:
