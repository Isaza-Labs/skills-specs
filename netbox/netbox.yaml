      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: dcim_device_roles_create
      summary: Create a device role
      tags: [dcim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                color: {type: string, description: "6-char hex color"}
                description: {type: string}
                tags: {type: array, items: {type: object}}
      responses:
        "201":
          description: Device role created

  /api/dcim/device-roles/{id}/:
    patch:
      operationId: dcim_device_roles_partial_update
      summary: Partially update a device role
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                slug: {type: string}
                color: {type: string}
                description: {type: string}
      responses:
        "200":
          description: Device role updated

  # ===== Manufacturers =====
    get:
      operationId: dcim_device_roles_retrieve
      summary: Get one of the device roles by ID
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
