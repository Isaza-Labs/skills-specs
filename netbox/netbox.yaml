openapi: "3.0.3"
info:
  title: NetBox REST API
  description: >
    NetBox DCIM/IPAM native REST API v4.4. GET to list/retrieve, POST to create, PATCH to partial update. All list endpoints return paginated JSON: {count, next, previous, results}. Query values may be strings, numbers or booleans; an array repeats the parameter once per element (status=active&status=planned).

    Every resource in this spec supports list, retrieve, create and partial update.
  version: "4.4"

paths:
  # ===== Devices =====
  /api/dcim/devices/:
    get:
      operationId: dcim_devices_list
      summary: List devices
      description: List all devices. Filter by name, site, role, device_type, status, tenant, platform, serial, tag, q (free-text search), etc.
      tags: [dcim]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}, description: "Filter by device name"}
      - {name: site, in: query, schema: {type: array, items: {type: string}}, description: "Filter by site (slug)"}
      - {name: site_id, in: query, schema: {type: array, items: {type: integer}}, description: "Filter by site ID"}
      - {name: role, in: query, schema: {type: array, items: {type: string}}, description: "Filter by device role (slug)"}
      - {name: role_id, in: query, schema: {type: array, items: {type: integer}}, description: "Filter by device role ID"}
      - {name: device_type, in: query, schema: {type: array, items: {type: string}}, description: "Filter by device type (slug)"}
      - {name: manufacturer, in: query, schema: {type: array, items: {type: string}}, description: "Filter by manufacturer (slug)"}
      - {name: status, in: query, schema: {type: array, items: {type: string}}, description: "active, planned, staged, failed, inventory, decommissioning, offline"}
      - {name: tenant, in: query, schema: {type: array, items: {type: string}}, description: "Filter by tenant (slug)"}
      - {name: platform, in: query, schema: {type: array, items: {type: string}}, description: "Filter by platform (slug)"}
      - {name: serial, in: query, schema: {type: array, items: {type: string}}, description: "Filter by serial number"}
      - {name: tag, in: query, schema: {type: array, items: {type: string}}, description: "Filter by tag (slug)"}
      - {name: q, in: query, schema: {type: string}, description: "Free-text search across name, serial, asset_tag"}
      - {name: has_primary_ip, in: query, schema: {type: boolean}, description: "Has a primary IP assigned"}
      - {name: region, in: query, schema: {type: array, items: {type: string}}, description: "Filter by region (slug)"}
      - {name: limit, in: query, schema: {type: integer, default: 50}, description: "Max results per page"}
      - {name: offset, in: query, schema: {type: integer, default: 0}, description: "Records to skip"}
      - {name: ordering, in: query, schema: {type: string}, description: "Sort field (prefix with - for descending)"}
      responses:
        "200":
          description: "Paginated list: {count, next, previous, results}"
    post:
      operationId: dcim_devices_create
      summary: Create a device
      description: Create a new device. References (site, device_type, role) accept integer ID or nested object with slug/name.
      tags: [dcim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_type, role, site]
              properties:
                name: {type: string}
                device_type: {description: "Device type ID (integer) or {slug: '...'}"}
                role: {description: "Device role ID (integer) or {slug: '...'}"}
                site: {description: "Site ID (integer) or {slug: '...'}"}
                status: {type: string, default: "active"}
                tenant: {description: "Tenant ID or {slug: '...'} (optional)"}
                platform: {description: "Platform ID or {slug: '...'} (optional)"}
                serial: {type: string}
                asset_tag: {type: string}
                rack: {type: integer}
                position: {type: number}
                face: {type: string, description: "front or rear"}
                comments: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Object whose keys MUST already be declared as custom fields for dcim.device. Pre-flight via extras_custom_fields_list?object_type=dcim.device, auto-create missing fields with extras_custom_fields_create. Sending an undeclared key returns 400."}
      responses:
        "201":
          description: Device created

  /api/dcim/devices/{id}/:
    get:
      operationId: dcim_devices_retrieve
      summary: Get one device
      description: Retrieve a single device by its integer ID, including primary_ip4, site, role, platform, tags and custom_fields.
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Device
    patch:
      operationId: dcim_devices_partial_update
      summary: Partially update a device
      description: Update specific fields of an existing device. Only send fields to change.
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: "Device ID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                status: {type: string}
                site: {description: "Site ID or {slug}"}
                role: {description: "Role ID or {slug}"}
                device_type: {description: "Device type ID or {slug}"}
                tenant: {description: "Tenant ID or {slug}"}
                platform: {description: "Platform ID or {slug}"}
                serial: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Object whose keys MUST already be declared as custom fields for dcim.device. Pre-flight via extras_custom_fields_list?object_type=dcim.device. Sending an undeclared key returns 400."}
      responses:
        "200":
          description: Device updated

  # ===== Sites =====
  /api/dcim/sites/:
    get:
      operationId: dcim_sites_list
      summary: List sites
      description: List all sites. Filter by name, slug, status, region, tenant, tag, q.
      tags: [dcim]
      parameters:
      - {name: name, in: query, schema: {type: array, items: {type: string}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: status, in: query, schema: {type: array, items: {type: string}}, description: "active, planned, staging, decommissioning, retired"}
      - {name: region, in: query, schema: {type: array, items: {type: string}}}
      - {name: tenant, in: query, schema: {type: array, items: {type: string}}}
      - {name: tag, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}, description: "Free-text search"}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      - {name: ordering, in: query, schema: {type: string}}
      responses:
        "200":
          description: "Paginated list: {count, next, previous, results}"
    post:
      operationId: dcim_sites_create
      summary: Create a site
      tags: [dcim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string}
                slug: {type: string}
                status: {type: string, default: "active"}
                region: {description: "Region ID (optional)"}
                tenant: {description: "Tenant ID or {slug} (optional)"}
                facility: {type: string}
                description: {type: string}
                physical_address: {type: string}
                shipping_address: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Pre-flight required: object_type=dcim.site"}
      responses:
        "201":
          description: Site created

  /api/dcim/sites/{id}/:
    patch:
      operationId: dcim_sites_partial_update
      summary: Partially update a site
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                slug: {type: string}
                status: {type: string}
                region: {description: "Region ID"}
                tenant: {description: "Tenant ID or {slug}"}
                description: {type: string}
                tags: {type: array, items: {type: object}}
                custom_fields: {type: object, description: "Pre-flight required: object_type=dcim.site"}
      responses:
        "200":
          description: Site updated

  # ===== Device Types =====
    get:
      operationId: dcim_sites_retrieve
      summary: Get one of the sites by ID
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Object
  /api/dcim/device-types/:
    get:
      operationId: dcim_device_types_list
      summary: List device types
      tags: [dcim]
      parameters:
      - {name: model, in: query, schema: {type: array, items: {type: string}}}
      - {name: manufacturer, in: query, schema: {type: array, items: {type: string}}, description: "Manufacturer slug"}
      - {name: manufacturer_id, in: query, schema: {type: array, items: {type: integer}}}
      - {name: slug, in: query, schema: {type: array, items: {type: string}}}
      - {name: q, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 50}}
      - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: "Paginated list"
    post:
      operationId: dcim_device_types_create
      summary: Create a device type
      tags: [dcim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manufacturer, model, slug]
              properties:
                manufacturer: {description: "Manufacturer ID (integer)"}
                model: {type: string}
                slug: {type: string}
                description: {type: string}
                u_height: {type: number, default: 1}
                tags: {type: array, items: {type: object}}
      responses:
        "201":
          description: Device type created

  /api/dcim/device-types/{id}/:
    patch:
      operationId: dcim_device_types_partial_update
      summary: Partially update a device type
      tags: [dcim]
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manufacturer: {description: "Manufacturer ID"}
                model: {type: string}
                slug: {type: string}
                description: {type: string}
      responses:
        "200":
          description: Device type updated

